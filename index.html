<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bahasa Melayu – Membaca Kosa Kata (Pekerjaan)</title>
  <style>
    :root {
      --primary-color: #6C5CE7;
      --secondary-color: #00CEC9;
      --accent-color: #FF7675;
      --bg-color: #F0F3F8;
      --card-bg: #FFFFFF;
      --text-color: #2D3436;
      --border-radius: 24px;
      --shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Fredoka', 'Arial', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 15px;
    }

    header {
      width: 100%;
      max-width: 500px;
      text-align: center;
      background: linear-gradient(135deg, #6C5CE7, #A29BFE);
      color: white;
      padding: 16px 20px;
      border-radius: var(--border-radius);
      box-shadow: var(--shadow);
    }

    .lang-badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.25);
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 4px;
    }

    h1 {
      font-size: 1.6rem;
      margin-bottom: 2px;
    }

    h2 {
      font-size: 1rem;
      font-weight: normal;
      opacity: 0.9;
    }

    .flashcard-wrapper {
      width: 100%;
      max-width: 500px;
      margin: 15px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .progress-bar-container {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      font-weight: bold;
      color: #636E72;
      font-size: 0.95rem;
    }

    .progress-bg {
      flex: 1;
      height: 14px;
      background: #DFE6E9;
      border-radius: 10px;
      margin: 0 12px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #00CEC9, #00B894);
      width: 8.33%;
      transition: width 0.3s ease;
    }

    .card {
      width: 100%;
      background: var(--card-bg);
      border-radius: var(--border-radius);
      padding: 20px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      border: 4px solid #E17055;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .card.speaking {
      transform: scale(1.02);
      box-shadow: 0 15px 35px rgba(225, 112, 85, 0.3);
      border-color: #FF7675;
    }

    .img-box {
      width: 100%;
      height: 220px;
      background: #F8F9FA;
      border-radius: 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
      border: 2px dashed #B2BEC3;
    }

    .card-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .default-icon {
      font-size: 5rem;
      user-select: none;
    }

    .btn-upload-single {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0,0,0,0.6);
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      z-index: 2;
    }

    .word-box {
      margin: 15px 0 5px 0;
      text-align: center;
    }

    .main-word {
      font-size: 2.8rem;
      font-weight: 800;
      color: #2D3436;
      letter-spacing: 1px;
      line-height: 1.1;
    }

    .suku-kata {
      font-size: 1.3rem;
      color: #0984E3;
      margin-top: 6px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .zh-text {
      font-size: 1.1rem;
      color: #636E72;
      margin-top: 4px;
    }

    .audio-btn {
      width: 100%;
      background: linear-gradient(135deg, #0984E3, #74B9FF);
      color: white;
      border: none;
      padding: 14px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 16px;
      margin-top: 15px;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(9, 132, 227, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: transform 0.1s ease;
    }

    .audio-btn:active {
      transform: scale(0.97);
    }

    .nav-controls {
      width: 100%;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 15px;
    }

    .btn-nav {
      flex: 1;
      padding: 12px;
      font-size: 1.05rem;
      font-weight: bold;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-prev { background-color: #B2BEC3; color: white; }
    .btn-next { background-color: #00B894; color: white; }

    .bottom-bar {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 10px;
    }

    .btn-tool {
      background: white;
      border: 2px solid #DFE6E9;
      padding: 8px 12px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 0.85rem;
      color: #2D3436;
      cursor: pointer;
    }

    .toast-warning {
      background-color: #FFEAA7;
      color: #D63031;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.85rem;
      margin-bottom: 10px;
      display: none;
      text-align: center;
      max-width: 500px;
    }

    .file-input { display: none; }
  </style>
</head>
<body>

  <header>
    <div class="lang-badge">Bahasa Melayu</div>
    <h1>Membaca Kosa Kata</h1>
    <h2>Tema: Pekerjaan</h2>
  </header>

  <div id="toastWarning" class="toast-warning">
    ⚠️ <strong>Notis Suara:</strong> Enjin pertuturan Bahasa Melayu (ms-MY) tidak ditemui pada peranti ini.
  </div>

  <div class="flashcard-wrapper">
    
    <div class="progress-bar-container">
      <span id="cardIndex">1 / 12</span>
      <div class="progress-bg">
        <div id="progressBar" class="progress-fill"></div>
      </div>
      <span>Kosa Kata</span>
    </div>

    <div class="card" id="mainCard">
      
      <button class="btn-upload-single" onclick="triggerUpload()">🖼️ Tukar PNG</button>
      <input type="file" id="singleFileInput" class="file-input" accept="image/png" onchange="handlePNGUpload(event)">

      <div class="img-box">
        <img id="cardImg" src="" alt="Gambar Pekerjaan" class="card-img" style="display:none;" onerror="handleImageError()">
        <div id="defaultIcon" class="default-icon">👩‍🏫</div>
      </div>

      <div class="word-box">
        <div class="main-word" id="wordText">guru</div>
        <div class="suku-kata" id="sukuKataText">gu · ru</div>
        <div class="zh-text" id="zhText">老师</div>
      </div>

      <button class="audio-btn" onclick="playCurrentWord()">
        🔊 Dengar Sebutan
      </button>

    </div>

    <div class="nav-controls">
      <button class="btn-nav btn-prev" onclick="prevCard()">◀ Sebelum</button>
      <button class="btn-nav btn-next" onclick="nextCard()">Seterusnya ▶</button>
    </div>

  </div>

  <div class="bottom-bar">
    <button class="btn-tool" onclick="playAllSequence()">🔊 Dengar Semua</button>
    <button class="btn-tool" onclick="stopSpeech()">⏸️ Berhenti</button>
    <button class="btn-tool" onclick="testVoice()">📢 Uji Suara</button>
    <button class="btn-tool" onclick="resetToFirst()">🔄 Mula Semula</button>
  </div>

  <script>
    const vocabularyList = [
      { id: 1, word: 'guru', sukuKata: 'gu · ru', zh: '老师', imgName: 'guru.png', emoji: '👩‍🏫' },
      { id: 2, word: 'doktor', sukuKata: 'dok · tor', zh: '医生', imgName: 'doktor.png', emoji: '👨‍⚕️' },
      { id: 3, word: 'jururawat', sukuKata: 'ju · ru · ra · wat', zh: '护士', imgName: 'jururawat.png', emoji: '👩‍⚕️' },
      { id: 4, word: 'ahli bomba', sukuKata: 'ah · li  bom · ba', zh: '消防员', imgName: 'ahli_bomba.png', emoji: '👨‍🚒' },
      { id: 5, word: 'polis', sukuKata: 'po · lis', zh: '警察', imgName: 'polis.png', emoji: '👮‍♂️' },
      { id: 6, word: 'peguam', sukuKata: 'pe · guam', zh: '律师', imgName: 'peguam.png', emoji: '⚖️' },
      { id: 7, word: 'hakim', sukuKata: 'ha · kim', zh: '法官', imgName: 'hakim.png', emoji: '👨‍⚖️' },
      { id: 8, word: 'tentera', sukuKata: 'ten · te · ra', zh: '军人', imgName: 'tentera.png', emoji: '💂‍♂️' },
      { id: 9, word: 'juruterbang', sukuKata: 'ju · ru · ter · bang', zh: '飞行员', imgName: 'juruterbang.png', emoji: '👨‍✈️' },
      { id: 10, word: 'jurutera', sukuKata: 'ju · ru · te · ra', zh: '工程师', imgName: 'jurutera.png', emoji: '👷‍♂️' },
      { id: 11, word: 'petani', sukuKata: 'pe · ta · ni', zh: '农夫', imgName: 'petani.png', emoji: '👨‍🌾' },
      { id: 12, word: 'nelayan', sukuKata: 'ne · la · yan', zh: '渔夫', imgName: 'nelayan.png', emoji: '🎣' }
    ];

    let currentIndex = 0;
    let currentVoice = null;
    let customImages = {};
    let isPlayingAll = false;
    let autoTimer = null;

    function initVoices() {
      if ('speechSynthesis' in window) {
        const voices = speechSynthesis.getVoices();
        currentVoice = voices.find(v => v.lang === 'ms-MY' || v.lang === 'ms_MY' || v.lang.startsWith('ms')) || null;
        
        const toast = document.getElementById('toastWarning');
        if (!currentVoice && voices.length > 0) {
          toast.style.display = 'block';
        } else {
          toast.style.display = 'none';
        }
      }
    }

    if ('speechSynthesis' in window) {
      speechSynthesis.onvoiceschanged = initVoices;
      initVoices();
    }

    function speak(text, onEndCallback = null) {
      if (!('speechSynthesis' in window)) {
        alert('Pelayar anda tidak menyokong fungsi suara.');
        return;
      }

      speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 0.8;
      utterance.pitch = 1.0;

      if (currentVoice) {
        utterance.voice = currentVoice;
        utterance.lang = currentVoice.lang;
      } else {
        utterance.lang = 'ms-MY';
      }

      utterance.onend = () => { if (onEndCallback) onEndCallback(); };
      utterance.onerror = () => { if (onEndCallback) onEndCallback(); };

      speechSynthesis.speak(utterance);
    }

    function stopSpeech() {
      isPlayingAll = false;
      clearTimeout(autoTimer);
      if ('speechSynthesis' in window) {
        speechSynthesis.cancel();
      }
      document.getElementById('mainCard').classList.remove('speaking');
    }

    function testVoice() {
      speak('Selamat datang! Mari belajar kosa kata bersama-sama.');
    }

    function updateCardDisplay() {
      const item = vocabularyList[currentIndex];

      document.getElementById('wordText').innerText = item.word;
      document.getElementById('sukuKataText').innerText = item.sukuKata;
      document.getElementById('zhText').innerText = item.zh;
      
      document.getElementById('cardIndex').innerText = `${currentIndex + 1} / ${vocabularyList.length}`;
      document.getElementById('progressBar').style.width = `${((currentIndex + 1) / vocabularyList.length) * 100}%`;

      const imgEl = document.getElementById('cardImg');
      const defaultIconEl = document.getElementById('defaultIcon');
      const customData = customImages[item.id];

      if (customData) {
        imgEl.src = customData;
        imgEl.style.display = 'block';
        defaultIconEl.style.display = 'none';
      } else {
        imgEl.src = `./images/${item.imgName}`;
        imgEl.style.display = 'block';
        defaultIconEl.style.display = 'none';
      }
    }

    function handleImageError() {
      const imgEl = document.getElementById('cardImg');
      const defaultIconEl = document.getElementById('defaultIcon');
      const item = vocabularyList[currentIndex];

      imgEl.style.display = 'none';
      defaultIconEl.style.display = 'block';
      defaultIconEl.innerText = item.emoji;
    }

    function playCurrentWord() {
      stopSpeech();
      const item = vocabularyList[currentIndex];
      const card = document.getElementById('mainCard');
      
      card.classList.add('speaking');
      speak(item.word, () => {
        card.classList.remove('speaking');
      });
    }

    function nextCard() {
      stopSpeech();
      if (currentIndex < vocabularyList.length - 1) {
        currentIndex++;
      } else {
        currentIndex = 0;
      }
      updateCardDisplay();
      playCurrentWord();
    }

    function prevCard() {
      stopSpeech();
      if (currentIndex > 0) {
        currentIndex--;
      } else {
        currentIndex = vocabularyList.length - 1;
      }
      updateCardDisplay();
      playCurrentWord();
    }

    function resetToFirst() {
      stopSpeech();
      currentIndex = 0;
      updateCardDisplay();
    }

    function playAllSequence() {
      stopSpeech();
      isPlayingAll = true;
      currentIndex = 0;
      playSequenceStep();
    }

    function playSequenceStep() {
      if (!isPlayingAll) return;

      updateCardDisplay();
      const item = vocabularyList[currentIndex];
      const card = document.getElementById('mainCard');
      
      card.classList.add('speaking');

      speak(item.word, () => {
        card.classList.remove('speaking');
        if (isPlayingAll) {
          autoTimer = setTimeout(() => {
            if (currentIndex < vocabularyList.length - 1) {
              currentIndex++;
              playSequenceStep();
            } else {
              isPlayingAll = false;
              alert('Tahniah! Anda telah mendengar semua kosa kata!');
            }
          }, 1200);
        }
      });
    }

    function triggerUpload() {
      document.getElementById('singleFileInput').click();
    }

    function handlePNGUpload(event) {
      const file = event.target.files[0];
      if (file && file.type === 'image/png') {
        const reader = new FileReader();
        reader.onload = function(e) {
          const item = vocabularyList[currentIndex];
          customImages[item.id] = e.target.result;
          localStorage.setItem('bm_pekerjaan_preview_pngs', JSON.stringify(customImages));
          updateCardDisplay();
        };
        reader.readAsDataURL(file);
      } else {
        alert('Sila pilih fail gambar PNG sahaja (请选择 PNG 格式图片).');
      }
    }

    function loadSavedImages() {
      const saved = localStorage.getItem('bm_pekerjaan_preview_pngs');
      if (saved) {
        try { customImages = JSON.parse(saved); } catch(e){}
      }
    }

    loadSavedImages();
    updateCardDisplay();
  </script>
</body>
</html>
